name: V2Ray Config Check

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: v2ray-config-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Xray
        env:
          XRAY_VERSION: v25.12.8
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /tmp/xray
          sudo install -m 755 /tmp/xray/xray /usr/local/bin/xray
          xray version

      - name: Run config checker
        env:
          V2RAY_MAX_CONFIGS: '0'
          V2RAY_DEADLINE_SECONDS: '2700'
          V2RAY_TCP_WORKERS: '128'
          V2RAY_TCP_TIMEOUT: '5'
          V2RAY_XRAY_WORKERS: '8'
          XRAY_PATH: /usr/local/bin/xray
          XRAY_STARTUP_DELAY: '0.25'
          XRAY_STARTUP_TIMEOUT: '4'
          XRAY_TEST_TIMEOUT: '10'
          PYTHONUNBUFFERED: '1'
        run: python v2ray_checker.py

      - name: Commit updated results
        run: |
          set -euo pipefail

          if ! grep -qE '^(vless|vmess|ss|trojan)://' result.txt; then
            echo "No working proxy configs in result.txt; skipping commit."
            exit 0
          fi

          if git diff --quiet -- result.txt; then
            echo "result.txt unchanged; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.txt
          git commit -m "chore: update working configs [skip ci]"
          # Resync in case another run committed in the meantime,
          # then push. Keep the newer remote list on conflict.
          git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME:-main}"
          git push
